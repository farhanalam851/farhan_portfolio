services:
  - type: web
    name: farhan-portfolio
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farhan-portfolio-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: farhan
      - key: DJANGO_SUPERUSER_EMAIL
        value: farhanalam8510@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false   # you type this in the Render dashboard; it is never stored in the repo

databases:
  - name: farhan-portfolio-db
    plan: free
